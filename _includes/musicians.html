<section class="section">
  <div class="container container--wide">
    <header style="display:grid; grid-template-columns: 1fr auto; gap: var(--space-3); align-items:end; margin-bottom: var(--space-6); flex-wrap: wrap;" class="reveal">
      <div>
        <p class="eyebrow" style="margin-bottom: var(--space-2);">In the hands of artists</p>
        <h2 style="max-width: 22ch;">Practiced by performers who&nbsp;<span class="italic text-gold">live</span> on the cycle.</h2>
      </div>
      <p style="color: var(--color-text-muted); max-width: 28ch; margin: 0; font-size: var(--text-base);">
        A few of the artists who use NagmaLive in the green room and on the road.
      </p>
    </header>

    <div class="musicians-grid">
      {% for musician in site.data.musicians %}
      <article class="musician reveal" data-delay="{{ forloop.index0 }}">
        <div class="musician__photo">
          <img src="{{ '/assets/images/' | append: musician.image | relative_url }}" alt="{{ musician.name }} — {{ musician.instrument }}">
        </div>
        <div class="musician__meta">
          <h3 class="musician__name">{{ musician.name }}</h3>
          <span class="musician__instrument">{{ musician.instrument }}</span>
        </div>
        <p class="musician__desc">{{ musician.description }}</p>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
